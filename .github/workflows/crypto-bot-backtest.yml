# Runs the crypto-bot backtest on GitHub's runners (which can reach Coinbase's
# public market data) and commits the generated report.md back to the branch.
# Backtest only: no keys, no secrets, no trading.
name: crypto-bot backtest

on:
  push:
    branches: [claude/crypto-dip-bounce-backtest-yic4v9]
    paths: ["crypto-bot/**", ".github/workflows/crypto-bot-backtest.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crypto-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crypto-bot/requirements.txt
      - name: Restore cached candles
        uses: actions/cache@v4
        with:
          path: crypto-bot/data
          key: candles-${{ github.run_id }}
          restore-keys: candles-
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python run_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            crypto-bot/report.md
            crypto-bot/results/sweep.csv
      - name: Commit report.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.md
          git diff --cached --quiet || git commit -m "Update crypto-bot backtest report"
          git push
